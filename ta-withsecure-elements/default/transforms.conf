[withsecure_vendor_product_lookup]
filename = withsecure_vendor_product.csv

# Search-time KV extraction for the embedded Windows Event Log XML carried by
# systemEventsLog events. The regex only matches the <Data Name='X'>Y</Data>
# pattern, which is unique to that engine's `details.eventXml` field, so it has
# no side-effect on events from the other engines (fileScanning, edr, firewall,
# applicationControl, etc.) — they simply produce no matches.
#
# Named capture groups `_KEY_1` and `_VAL_1` are a documented Splunk pattern
# for "this regex pulls a KV pair, use group 1 as the field name and group 2
# as its value". Re-applies on every match in the event, so all <Data> rows
# yield distinct fields (TargetUserName, LogonType, IpAddress, ProcessName,
# etc. — Windows EventLog field names verbatim, PascalCase).
[withsecure_wineventlog_data]
REGEX = <Data\s+Name='(?<_KEY_1>[^']+)'>(?<_VAL_1>[^<]*)</Data>

# KV Store lookup: checkpoints
[checkpoints_lookup]
collection = checkpoints
external_type = kvstore
fields_list = _key, key, value, updated_at
